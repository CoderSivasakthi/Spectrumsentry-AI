[project]
name = "spectrumsentry-ai"
version = "0.1.0"
description = "AI-based wireless communication monitoring, signal analysis, modulation classification, experiment history, and anomaly detection platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "matplotlib>=3.9.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short"
